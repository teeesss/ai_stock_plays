# ---------------------------------------------------------------------------
# AUTO BADGE RULES  (Fallback formatter when source is not in source_space_map)
# CamelCase splitting is always attempted first.
# acronym_max_length: single tokens at or below this char count → ALL-CAPS (WSJ, FT, IBD)
# camel_split: true = split compound names (DailyHunt → Daily Hunt)
# ---------------------------------------------------------------------------
auto_badge_rules:
  acronym_max_length: 5
  camel_split: true

# ---------------------------------------------------------------------------
# MAX PER SOURCE  (Source diversity cap)
# ---------------------------------------------------------------------------
max_per_source: 15

# ---------------------------------------------------------------------------
# AGGREGATOR GATING
# untrusted_aggregators: Sources that require whitelist verification.
# ---------------------------------------------------------------------------
untrusted_aggregators:
  - "Google News"

# ---------------------------------------------------------------------------
# GOOGLE NEWS WHITELIST (Top 20 Institutional Gold Standard)
# Only articles from these sources are allowed from broad aggregators.
# ---------------------------------------------------------------------------
google_news_whitelist:
  - "REUTERS"
  - "CNBC"
  - "BENZINGA"
