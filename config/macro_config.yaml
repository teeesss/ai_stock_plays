# ============================================================================
# V28: MacroAggregator Configuration — Optimized & 2026-Tuned
# ============================================================================
# SINGLE SOURCE OF TRUTH. All scoring, keywords, feeds, and tickers live here.
#
# Changes from V27:
#   • Higher cluster multiplier (1.55) — rewards dense photonics/packaging headlines
#   • New 2026 photonics terms: NPO, METALENS, PAM4, O-BAND, C-BAND, UCIe,
#     HYBRID BONDING, SOIC-X, COHERENT DSP
#   • Expanded + revalued bonus_keywords for CPO/COUPE ramp
#   • Expanded cluster_terms: COUPE, TSMC COUPE, CO-WOS, SILICON PHOTONICS,
#     BROADCOM, MARVELL, ASML, HYBRID BONDING, METALENS, SOIC-X
#   • Bloomberg feed added; CPO/Semi Google feeds expanded with richer queries
#   • Full feed list preserved from V27 + V28 additions
#   • AI models section restored (ANTHROPIC/MYTHOS now market-moving)
#   • CEASEFIRE retained (geopolitically active)
#   • All V27 institutional keywords preserved in proper YAML format
#   • CIEN added to tickers; all V27 tickers retained
#   • Merged blacklist and forbidden_domains from both versions
#   • IBD feed corrected to active feedburner URL
# ============================================================================

# ---------------------------------------------------------------------------
# SCORING RULES & MULTIPLIERS
# ---------------------------------------------------------------------------
scoring_rules:
  priority_keyword_weight: 50
  anchor_word_weight: 200
  blacklist_penalty: -1000
  relevance_floor_penalty: 0
  billion_scale_bonus: 45
  billion_scale_regex: '\$?\s?\d+(\.\d+)?\s?(B|BN|BILLION|TRILLION)'
  cluster_multiplier: 1.55

  # V28: Custom FinVADER Sentiment Overrides
  # These are mathematically injected into the NLP engine. 
  # Use positive for bullish/good, negative for bearish/bad.
  vader_financial_lexicon:
    "bullish": 2.5
    "bearish": -2.5
    "upgrade": 2.0
    "downgrade": -2.0
    "outperform": 1.5
    "underperform": -1.5
    "beat": 1.5
    "missed": -1.5
    "rally": 2.0
    "plunge": -2.5
    "surge": 2.0
    "plummet": -2.5
    "breakthrough": 2.5
    "bottleneck": -1.5

# ---------------------------------------------------------------------------
# UNTRUSTED AGGREGATORS (Trigger Relevance Floor)
# ---------------------------------------------------------------------------
untrusted_aggregators:
  - "Google News"

# ---------------------------------------------------------------------------
# BASE SCORING EXPLANATION
# ---------------------------------------------------------------------------
# priority_keywords & institutional_keywords -> +50 each (or priority_keyword_weight)
# anchor_words -> +200 (or anchor_word_weight)
# bonus_keywords -> variable (extra on top of +50 from priority)
# billion_scale_bonus -> +45 if "$1B", "billion", etc. in headline
# cluster_terms -> if 2+ appear in same headline -> score *= cluster_multiplier

