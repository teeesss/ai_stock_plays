[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722"] # Line too long and bare except blocks

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E712", "E402", "F401", "F841"] # Allow bool comparisons and unused vars in tests
"engine/*" = ["E402", "F401", "F841", "E722"] # Allow dynamic imports and unused vars in engine
