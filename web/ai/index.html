        .pill:hover { background: #26334d; color: var(--text-main); }
        .pill.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 8px rgba(14,165,233,0.2); }

        /* Table */
        .table-area { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-grow: 1; min-height: 400px; display: flex; flex-direction: column; }

        td { padding: 8px 5px; border-bottom: 1px solid var(--border); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:hover td { background: rgba(14,165,233,0.04); }
        tr.pinned td { background: rgba(245,158,11,0.04); border-left: 4px solid var(--gold); }
        tr.private-row td { opacity: 0.8; }

        .pin-btn { cursor: pointer; color: #334155; font-size: 14px; }
        .pin-btn.active { color: var(--gold); }
        .ticker { color: var(--gold); font-weight: 800; font-size: 13px; font-family: inherit; }
        .private-badge { font-size: 8px; color: var(--purple); font-weight: 700; display: block; margin-top: 1px; }
        .chip { background: #1e293b; padding: 2px 5px; border-radius: 4px; font-weight: 700; font-size: 10px; display: inline-block; min-width: 28px; text-align: center; }
        .rank-num { font-size: 10px; color: #64748b; font-weight: 800; display: block; text-align: center; }

        .mb { width: 10px; height: 3px; border-radius: 1px; background: #334155; }
        .mb.up { background: var(--green); box-shadow: 0 0 4px rgba(16,185,129,0.3); }
        .mb.down { background: var(--danger); }
        .region-tag { font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 3px; background: rgba(14,165,233,0.1); color: var(--accent); border: 1px solid rgba(14,165,233,0.25); text-transform: uppercase; }
        .watchlist-divider td { background: rgba(168,85,247,0.08) !important; color: var(--purple); font-weight: 900; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; border-top: 2px solid rgba(168,85,247,0.4); }
        
        .x-intel-icon { font-size: 10px; margin-left: 5px; cursor: pointer; opacity: 0.5; transition: opacity 0.2s, color 0.2s; color: var(--text-dim); }
        .x-intel-icon:hover { opacity: 1; color: var(--accent); }
        .co-name { font-size: 10px; color: #94a3b8; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; margin-top: 1px; }
        
        /* Column Specifics */
        th.col-rank { text-align: center; width: 45px; padding-left: 0; padding-right: 0; }
    </style>
</head>

document.addEventListener('DOMContentLoaded', () => {
    const isRemote = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && !window.location.hostname.startsWith('192.168.');

        btn.classList.add('busy');
        btn.onclick = () => alert("This terminal is in Remote Mode. The data is automatically synchronized daily at 4:20 PM EST by the Master Bridge. Manual sync must be triggered from the local machine hosting the bridge.");

    initPulse();
    render();
});
</script>

function formatMCap(b) {
    if (!b || b <= 0) return '--';
    let res = '';
    if (b >= 1000) {
        const t = b / 1000;
        res = (t < 10 ? t.toFixed(2) : t.toFixed(1)) + 'T';
    } else if (b >= 1) {
        res = b.toFixed(1) + 'B';
    } else {
        const m = b * 1000;
        res = m.toFixed(1) + 'M';
    }
    return res;
}

function getWeights(agg) {
    const w1 = { s: 0.70, a: 0.20, d: 0.00, m: 0.00 }; // As requested
    const w5 = { s: 0.30, a: 0.40, d: 0.15, m: 0.15 };
    const w10= { s: 0.05, a: 0.40, d: 0.50, m: 0.15 }; // As requested
    if (agg <= 5) {
        const ratio = (agg - 1) / 4;
        return { safety: w1.s + ratio*(w5.s - w1.s), alpha: w1.a + ratio*(w5.a - w1.a), discovery: w1.d + ratio*(w5.d - w1.d), momentum: w1.m + ratio*(w5.m - w1.m) };
    } else {
        const ratio = (agg - 5) / 5;
        return { safety: w5.s + ratio*(w10.s - w5.s), alpha: w5.a + ratio*(w10.a - w5.a), discovery: w5.d + ratio*(w10.d - w5.d), momentum: w5.m + ratio*(w10.m - w5.m) };
    }
}

function momentumScore(perf1y) {
    if (perf1y === undefined || perf1y === null) return 4;
    if (perf1y > 300) return 5; if (perf1y > 100) return 9;
    if (perf1y > 40) return 10; if (perf1y > 10) return 7;
    if (perf1y > 0) return 5; if (perf1y > -25) return 3; return 1;
}

function buildTickerHTML(ticker) {
    // Strip exchange suffixes for X (e.g., 3105.TW -> 3105)
    const primary = ticker.split(/[\/\.]/)[0].trim();

    if (!ticker.includes('/')) return `<a href="https://finance.yahoo.com/quote/${ticker}" target="_blank" class="ticker-link">${ticker}</a>${xIcon}`;
    const parts = ticker.split('/').map(t => t.trim());
    return `<a href="https://finance.yahoo.com/quote/${parts[0]}" target="_blank" class="ticker-link">${parts[0]}</a><a href="https://finance.yahoo.com/quote/${parts[1]}" target="_blank" class="ticker-otc" title="US OTC: ${parts[1]}">OTC:${parts[1]}</a>${xIcon}`;
}

function calcScore(h, mcapB, perf1y, rev_num, pe26, agg) {
    const w = getWeights(agg);
    const alpha = sfloat(h['Alpha Score'] || 0);
    const subjectiveSafety = 10 - sfloat(h['Risk Adj'] || 5);
    const discovery = sfloat(h['Hiddenness'] || 5);
    const mom = momentumScore(perf1y);
    const multiplier = BUCKET_MULT[h.Bucket] || 0.20;

    let mcapAdj = 0;
    if (mcapB > 200) mcapAdj = 2.0;
    else if (mcapB > 10) mcapAdj = 1.0;
    else if (mcapB >= 2) mcapAdj = 0;
    else if (mcapB >= 0.3) mcapAdj = -1.0;
    else if (mcapB > 0) mcapAdj = -2.0;
    else mcapAdj = -2.0; // Default penalty for unknowns

    let safety = subjectiveSafety + mcapAdj;
    if (safety < 0) safety = 0;
    if (safety > 10) safety = 10;

    let finalMult = 1.0;
    
    // Aggressive micro/small cap suppression on Safe settings to break through Bucket multipliers
    if (agg <= 3 && mcapB < 2.0) {
        finalMult *= 0.15; // Mathematically vanish from top 20
    } else if (agg <= 5 && mcapB < 0.3) {
        finalMult *= 0.30; 
    }

    if (agg >= 6) {
        if (rev_num > 100) finalMult *= 1.20;
        else if (rev_num > 30) finalMult *= 1.10;
        if (pe26 > 100 && pe26 < 999 && rev_num < 20) finalMult *= 0.90; // Overvalued trap
    }

    // 13F Conviction Boost (V16 Alpha Layer)
    let convictionBoost = 0;
    if (h.inst_13f_alpha && h.inst_13f_alpha.conviction_count) {
        convictionBoost = h.inst_13f_alpha.conviction_count * 15; // +15 points per conviction holder
    }

    let baseScore = (alpha * w.alpha + safety * w.safety + discovery * w.discovery + mom * w.momentum) * multiplier * 10 * finalMult;
    return baseScore + convictionBoost;
}

function parseUpside(str) {
    if (!str || str === '--') return 0;
    const m = String(str).match(/([\d.]+)/); if (!m) return 0;
    const n = parseFloat(m[1]); return str.includes('%') ? n / 100 : n - 1;
}

function get1yPerf(entry) {
    const p = entry.performance || {}; if (p['1y'] !== undefined) return p['1y'];
    const h = entry.history || []; if (h.length < 2) return undefined;
    const now = Date.now(), ya = now - 365*86400000;
    const s = h.find(pt => pt.x >= ya) || h[0]; const e = h[h.length-1];
    return (e.x - s.x > 300*86400000) ? Math.round(((e.y/s.y)-1)*100) : undefined;
}

function passesFilters(e) {
    if (state.search && !e.searchStr.includes(state.search)) return false;
    if (e.mcapB < state.minMcap || e.mcapB > state.maxMcap) return false;

    // P/E filters: pe26/pe27 === 999 means no data (no EPS estimate).
    // When a MAX filter is set, exclude stocks with no data (999).
    // When only a MIN filter is set, stocks with no data (999) are allowed through.
    const pe26Active = state.minPe26 > -Infinity || state.maxPe26 < Infinity;
    const pe27Active = state.minPe27 > -Infinity || state.maxPe27 < Infinity;
    if (pe26Active) {
        const hasPe26 = e.pe26 < 999;
        if (state.maxPe26 < Infinity && !hasPe26) return false; // max filter: exclude no-data
        if (hasPe26 && (e.pe26 < state.minPe26 || e.pe26 > state.maxPe26)) return false;
    }
    if (pe27Active) {
        const hasPe27 = e.pe27 < 999;
        if (state.maxPe27 < Infinity && !hasPe27) return false; // max filter: exclude no-data
        if (hasPe27 && (e.pe27 < state.minPe27 || e.pe27 > state.maxPe27)) return false;
    }

    // OBB filters: only apply if a field has real data
    const instPct = sfloat(e.obb?.inst_ownership_pct);
    const shortPct = sfloat(e.obb?.short_interest_pct);
    const analysts = sfloat(e.obb?.analyst_count);
    const hasInst = e.obb?.inst_ownership_pct != null && e.obb.inst_ownership_pct !== '';
    const hasShort = e.obb?.short_interest_pct != null && e.obb.short_interest_pct !== '';
    const hasAnalysts = e.obb?.analyst_count != null && e.obb.analyst_count !== '';
    if (state.minInst > -Infinity || state.maxInst < Infinity) {
        if (!hasInst) return false; // filter active but no data → exclude
        if (instPct < state.minInst || instPct > state.maxInst) return false;
    }
    if (state.minShort > -Infinity || state.maxShort < Infinity) {
        if (!hasShort) return false;
        if (shortPct < state.minShort || shortPct > state.maxShort) return false;
    }
    if (state.minAnalysts > -Infinity || state.maxAnalysts < Infinity) {
        if (!hasAnalysts) return false;
        if (analysts < state.minAnalysts || analysts > state.maxAnalysts) return false;
    }

    // Buzz filter: parse 7d count as integer
    const buzzCount = parseInt(e.buzz?.['7d'] || '0', 10) || 0;
    if (state.minBuzz > -Infinity || state.maxBuzz < Infinity) {
        if (buzzCount < state.minBuzz || buzzCount > state.maxBuzz) return false;
    }

    if (state.selectedBuckets.length > 0) {
        const match = state.selectedBuckets.some(b => b.toUpperCase() === (e.h.Bucket || '').toUpperCase());
        if (!match) return false;
    }
    if (state.selectedExchanges.length > 0) {
        const match = state.selectedExchanges.some(ex => ex.toUpperCase() === (e.exchange || '').toUpperCase());
        if (!match) return false;
    }
    if (sfloat(e.h['Alpha Score']) < state.minAlpha || sfloat(e.h['Alpha Score']) > state.maxAlpha) return false;
    if (e.rev_num < state.minRev) return false;
    return true;
}

function getExchAbbrev(full) {
    if (!full) return '--';
    const map = {
        'CANADA': 'CA', 'CHINA': 'CN', 'EUROPE': 'EU', 'HONG KONG': 'HK',
        'JAPAN': 'JP', 'MALAYSIA': 'MY', 'S.KOREA': 'KR', 'SWEDEN': 'SE',
        'TAIWAN': 'TW', 'UK': 'UK', 'US': 'US',
        'NasdaqGS': 'NSQ', 'NasdaqGM': 'NSQ', 'Nasdaq': 'NSQ', 'NYSE': 'NYSE', 'Pink Sheets': 'OTC', 'NMS': 'NSQ', 'NYQ': 'NYSE', 'PNK': 'PINK', 'BTS': 'BITS', 'NGM': 'NSQ', 'NCM': 'NSQ'
    };
    const key = String(full).toUpperCase();
    return map[key] || full.substring(0,3).toUpperCase();
}


function sortFn(a, b) {
    let av, bv; const col = state.sortCol || 'best';
    if (col === 'best') { av = a.score; bv = b.score; }
    else if (col === 'pinned') { av = state.pinned.includes(a.ticker)?1:0; bv = state.pinned.includes(b.ticker)?1:0; }
    else if (col === 'ticker') { av = a.ticker; bv = b.ticker; }
    else if (col === 'company') { av = (a.h.Company||'').toLowerCase(); bv = (b.h.Company||'').toLowerCase(); }
    else if (col === 'alpha') { av = sfloat(a.h['Alpha Score']); bv = sfloat(b.h['Alpha Score']); }
    else if (col === 'risk') { av = sfloat(a.h['Risk Adj']); bv = sfloat(b.h['Risk Adj']); }
    else if (col === 'hidden') { av = sfloat(a.h['Hiddenness']); bv = sfloat(b.h['Hiddenness']); }
    else if (col === 'country') { av = (a.exchange||'').toLowerCase(); bv = (b.exchange||'').toLowerCase(); }
    else if (col === 'upside') { av = parseUpside(a.h['Target Upside']); bv = parseUpside(b.h['Target Upside']); }

    else if (col === 'mcap') { av = a.mcapB; bv = b.mcapB; }
    else if (col === 'pe26') { av = a.pe26; bv = b.pe26; }
    else if (col === 'pe27') { av = a.pe27; bv = b.pe27; }
    else if (col === 'perf1y') { av = a.perf1y??-9999; bv = b.perf1y??-9999; }
    else if (col === 'rev') { av = a.rev_num; bv = b.rev_num; }
    else if (col === 'today') { av = a.todayChg??-9999; bv = b.todayChg??-9999; }
    else if (col === 'todayPct') { av = a.todayPct??-9999; bv = b.todayPct??-9999; }
    else if (col === 'ext')   { av = a.extPct??-9999;   bv = b.extPct??-9999; }
    else { av = (a.h.Role||'')+(a.h.Notes||''); bv = (b.h.Role||'')+(b.h.Notes||''); }
    if (typeof av === 'string' && typeof bv === 'string') return av.localeCompare(bv) * state.sortDir;
    return (av < bv ? -1 : (av > bv ? 1 : 0)) * state.sortDir;
}

function initBuckets() {
    const entries = buildEntries();
    const buckets = new Set(), exchanges = new Set();
    entries.forEach(e => { 
        if (e.h.Bucket !== 'Private') buckets.add(e.h.Bucket); 
        if (e.exchange) exchanges.add(e.exchange); 
    });
    const container = document.getElementById('bucketPills'); container.innerHTML = '';
    
    const mk = (t, s, k) => {
        const h = document.createElement('div'); h.className='section-label'; h.innerText=t; container.appendChild(h);
        const row = document.createElement('div'); row.className='pill-row';
        Array.from(s).filter(Boolean).sort().forEach(i => {
            const p = document.createElement('div'); p.className='pill'; p.innerText=i.toUpperCase();
            p.onclick = () => { p.classList.toggle('active'); state[k].includes(i) ? state[k]=state[k].filter(x=>x!==i) : state[k].push(i); render(); };
            row.appendChild(p);
        });
        if (t === 'SECTORS') {
            const pp = document.createElement('div'); pp.className='pill priv-pill' + (state.showPrivate ? ' active' : ''); pp.innerText='🔒 SHOW PRIVATE';
            pp.onclick = () => { state.showPrivate = !state.showPrivate; pp.classList.toggle('active', state.showPrivate); render(); };
            row.appendChild(pp);
        }
        container.appendChild(row);
    };
    mk('SECTORS', buckets, 'selectedBuckets'); mk('EXCHANGES', exchanges, 'selectedExchanges');
}

function updateChart() {
    const panel = document.getElementById('chartPanel');
    if (!state.pinned.length) { panel.classList.remove('active'); return; }
    panel.classList.add('active');
    const limits = {'1m':30,'6m':182,'1y':365,'3y':1095,'5y':1825};
    const limit = Date.now() - (limits[state.range]*86400000);
    const series = state.pinned.map(t => {
        const h = data[t]?.history || []; const f = h.filter(p=>p.x>=limit);
        if (f.length < 2) return null; const b = f[0].y;
        return { name: t, data: f.map(p=>({x:p.x, y:Math.round(((p.y/b)-1)*100)})) };
    }).filter(Boolean);
    chart.updateSeries(series);
}

// WEB BRIDGE SYNC
const BRIDGE_BASE = 'http://localhost:5174';
const syncBtn = document.getElementById('syncBtn');
async function triggerSync() {
    if (syncBtn.classList.contains('busy')) return;
    syncBtn.classList.add('busy'); try {
        const r = await fetch(`${BRIDGE_BASE}/api/sync`, { method: 'POST' });
        if (r.ok || r.status === 409) pollSyncStatus();
    } catch { syncBtn.classList.remove('busy'); syncBtn.classList.add('error'); }
}
function pollSyncStatus() {
    const i = setInterval(async () => {
        try {
            const r = await fetch(`${BRIDGE_BASE}/api/status`); const d = await r.json();
            if (d.status === 'idle') { clearInterval(i); syncBtn.classList.remove('busy'); setTimeout(()=>location.reload(), 1000); }
        } catch { clearInterval(i); }
    }, 3000);
}

function initPulse() {
    const pulse = document.getElementById('pulseContainer');
    const meta = (window.LIVE_PRICES || {})._meta;
    const est = meta?.refreshed_at_est || '--';
    const hdrTime = document.getElementById('price-updated-at');
    if (hdrTime) hdrTime.innerText = est;

    if (!meta || !meta.top_gainers) {
        pulse.innerHTML = `<div class="no-pulse"><span class="sync-dot"></span> <div>LIVE PRICES NOT LOADED. RUN <code>python engine/live_prices.py</code> TO ACTIVATE TERMINAL PULSE.</div></div>`;
        return;
    }
    
    let html = `<div class="pulse-bar"><div class="pulse-label">CPO PULSE</div>`;
    
    // Top Gainers
    meta.top_gainers.slice(0,3).forEach(g => {
        const chg = (g.change_pct != null) ? g.change_pct.toFixed(1) : '0.0';
        html += `<div class="pulse-item"><span style="color:var(--text-dim)">$</span>${g.ticker} <span class="up">+${chg}%</span></div><div class="pulse-sep">|</div>`;
    });
    
    // Top Losers
    meta.top_losers.slice(0,2).forEach(l => {
        const chg = (l.change_pct != null) ? l.change_pct.toFixed(1) : '0.0';
        html += `<div class="pulse-item"><span style="color:var(--text-dim)">$</span>${l.ticker} <span class="down">${chg}%</span></div><div class="pulse-sep">|</div>`;
    });
    
    // Volume Spikes
    meta.volume_spikes.slice(0,2).forEach(v => {
        html += `<div class="pulse-item"><span class="pulse-vol">VOL!</span> ${v.ticker} <span style="color:var(--purple)">${v.vol_spike}x</span></div><div class="pulse-sep">|</div>`;
    });
    
    // Use the authoritative EST string from Python instead of browser local time
    const timeStr = meta.refreshed_at_est || (meta.refreshed_at.includes('EST') ? meta.refreshed_at : new Date(meta.refreshed_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
    html += `<div class="pulse-time"><span class="sync-dot pulse"></span> UPDATED ${timeStr}</div></div>`;

    pulse.innerHTML = html;
}

function filterNews() {
    const db = window.YAHOO_NEWS_MODULE;
    if (!db || !db.articles) {
        document.getElementById('newsBody').innerHTML = '<div style="text-align:center;color:var(--text-dim);margin-top:20px;font-size:9px;">NO NEWS DATA. RUN engine/sync_news.py TO POPULATE.</div>';
        return;
    }
    const q = (document.getElementById('newsSearch')?.value || '').toLowerCase().trim();
    const articles = db.articles.filter(a => {
        if (!q) return true;
        return (a.title||'').toLowerCase().includes(q) || (a.summary||'').toLowerCase().includes(q) || (a.tickers||[]).some(t => t.toLowerCase().includes(q.replace('$','')));
    });
    renderNews(articles, q);
}

function renderNews(articles, query='', limit=50) {
    const container = document.getElementById('newsBody');
    const countEl = document.getElementById('news-count');
    const shown = articles.slice(0, limit);
    if (countEl) countEl.innerText = `${articles.length} ARTICLES`;
    if (!shown.length) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-dim);margin-top:20px;font-size:9px;">NO MATCHING ARTICLES.</div>';
        return;
    }
    container.innerHTML = shown.map(a => {
        const tickers = (a.tickers||[]).map(t => `<span style="background:rgba(212,163,115,0.15);color:var(--gold);padding:1px 5px;border-radius:3px;font-size:9px;font-weight:900;margin-right:3px;cursor:pointer;" onclick="syncNewsSearch('${t}')">\$${t}</span>`).join('');
        const pub = a.published_est || a.published || '';
        const src = a.source || '';
        let title = a.title || '';
        if (query && query.length > 1) {
            const re = new RegExp(`(${query.replace(/[$]/g,'\\$')})`, 'gi');
            title = title.replace(re, '<span class="highlight">$1</span>');
        }
        return `<div class="intel-item">
            <div class="meta" style="justify-content:space-between;">
                <span style="color:var(--accent);font-weight:700;font-size:9px;">${src}</span>
                <span style="color:var(--text-dim);font-size:9px;">${pub}</span>
            </div>
            <div style="margin:4px 0 5px;font-size:11px;font-weight:700;line-height:1.4;">${title}</div>
            <div style="font-size:9px;color:#94a3b8;margin-bottom:5px;">${a.summary ? a.summary.substring(0,180)+'...' : ''}</div>
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">${tickers}</div>
            <div style="margin-top:6px;text-align:right;"><a href="${a.url}" target="_blank" style="font-size:8px;color:var(--accent);text-decoration:none;">READ ARTICLE ↗</a></div>
        </div>`;
    }).join('');
}

function openNewsModal() {
    document.getElementById('newsModal').classList.add('active');
    filterNews();
}

function closeNewsModal() {
    document.getElementById('newsModal').classList.remove('active');
}

function syncNewsSearch(ticker) {
    const q = ticker.startsWith('$') ? ticker.replace('$','') : ticker;
    const el = document.getElementById('newsSearch');
    if (el) el.value = '$' + q;
    openNewsModal();
}
