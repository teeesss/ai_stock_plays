<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Intelligence | Historical Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --accent: #1d4ed8;
            --blue: #38bdf8;
            --gold: #f59e0b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .header {
            max-width: 900px;
            margin: 0 auto 40px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 20px;
        }
        .title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--gold);
        }
        .subtitle {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .archive-entry {
            background: var(--surface);
            border-left: 4px solid var(--blue);
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--blue);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .content {
            font-size: 15px;
            color: var(--text);
            white-space: pre-wrap;
        }
        .no-data {
            text-align: center;
            padding: 100px 0;
            color: var(--text-dim);
            font-style: italic;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <div class="subtitle">Institutional Historical Ledger // 48-Hour Rolling Intel</div>
        <div class="title">🕰️ SYNOPSIS ARCHIVE</div>
    </div>

    <div class="container">

            <div class="no-data">No historical dossiers found in current 48-hour window.</div>
        {% else %}
            <div class="no-data">No historical dossiers found in current 48-hour window.</div>


        <a href="/stocks/email" class="back-link">← RETURN TO LIVE COCKPIT</a>
    </div>
</body>
</html>
